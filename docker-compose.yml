networks:
  server-network:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

services:
  webserver:
    image: nginx:alpine
    container_name: ${WEBSERVER_CONTAINER_NAME:-container_webserver}
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    volumes:
      - ./sites:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      - server-network

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    image: app-php:8.4
    container_name: ${PHP_CONTAINER_NAME:-container_php}
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    working_dir: /usr/share/nginx/html
    volumes:
      - ./sites:/usr/share/nginx/html:ro
      - ./storage:/var/www/storage
    environment:
      TZ: ${TZ:-Europe/London}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ALLOW_EMPTY_PASSWORD: ${DB_ALLOW_EMPTY_PASSWORD:-no}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - server-network

  mariadb:
    profiles: ["mysql"]
    image: mariadb:11.8
    container_name: ${MARIADB_CONTAINER_NAME:-container_mariadb}
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/London}
      MARIADB_DATABASE: ${DB_DATABASE:-app_db}
      MARIADB_USER: ${DB_USER:-ca_user}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_ALLOW_EMPTY_PASSWORD: ${DB_ALLOW_EMPTY_PASSWORD:-no}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - server-network

  phpmyadmin:
    profiles: ["mysql"]
    image: phpmyadmin:latest
    container_name: ${PHPMYADMIN_CONTAINER_NAME:-container_phpmyadmin}
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - server-network

  postgresdb:
    profiles: ["postgres"]
    image: postgres:18.2
    container_name: "${CONTAINER_PREFIX:-app}_postgres"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - server-network

  pgadmin:
    profiles: ["postgres"]
    container_name: "${CONTAINER_PREFIX:-app}_pgadmin"
    image: elestio/pgadmin:latest
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    ports:
      - "${PGADMIN_PORT:-8081}:8080"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${DB_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${DB_PASSWORD}"
      PGADMIN_LISTEN_PORT: 8080
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    depends_on:
      - postgresdb
    networks:
      - server-network
  proxy_https:
    image: nginx:alpine
    container_name: ${PROXY_CONTAINER_NAME:-container_webserver_proxy_https}
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      webserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1/healthz || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - server-network

volumes:
  mariadb_data:
    driver: local
  postgres_data:
    driver: local
