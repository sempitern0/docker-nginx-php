networks:
  server-network:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

services:
  webserver:
    image: nginx:1.31.5-alpine3.24
    container_name: ${WEBSERVER_CONTAINER_NAME:-container_webserver}
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    volumes:
      - ./sites:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      - server-network

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    image: app-php:8.4
    container_name: ${PHP_CONTAINER_NAME:-container_php}
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    working_dir: /usr/share/nginx/html
    volumes:
      - ./sites:/usr/share/nginx/html:ro
      - ./storage:/var/www/storage
    environment:
      APP_NAME: ${APP_NAME:-MYSITE}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/London}
      APP_DOMAIN: ${APP_DOMAIN}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_LOCALE: ${APP_LOCALE:-en}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ALLOW_EMPTY_PASSWORD: ${DB_ALLOW_EMPTY_PASSWORD:-no}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      ADMIN_GATE_SECRET: ${ADMIN_GATE_SECRET}
      ADMIN_GATE_TIMEOUT: ${ADMIN_GATE_TIMEOUT:-3600}
      SESSION_NAME: ${SESSION_NAME:-MERCADOBLANCO_SESSID}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-1800}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_SAMESITE: ${SESSION_SAMESITE:-Lax}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      MFA_PENDING_TIMEOUT: ${MFA_PENDING_TIMEOUT:-300}
      AUTHORIZATION_CACHE_TTL: ${AUTHORIZATION_CACHE_TTL:-0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.0.0/24}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET}
      LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-20}
      LOGIN_IP_WINDOW_SECONDS: ${LOGIN_IP_WINDOW_SECONDS:-300}
      LOGIN_USER_MAX_ATTEMPTS: ${LOGIN_USER_MAX_ATTEMPTS:-5}
      LOGIN_USER_WINDOW_SECONDS: ${LOGIN_USER_WINDOW_SECONDS:-900}

    depends_on:
      mariadb:
        condition: service_healthy
        required: false
      postgresdb:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - server-network

  mariadb:
    profiles: ["mysql"]
    image: mariadb:11.8.9
    container_name: ${MARIADB_CONTAINER_NAME:-container_mariadb}
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/London}
      MARIADB_DATABASE: ${DB_DATABASE:-app_db}
      MARIADB_USER: ${DB_USER:-ca_user}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_ALLOW_EMPTY_PASSWORD: ${DB_ALLOW_EMPTY_PASSWORD:-no}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - server-network

  phpmyadmin:
    profiles: ["mysql"]
    image: phpmyadmin:5.2.3
    container_name: ${PHPMYADMIN_CONTAINER_NAME:-container_phpmyadmin}
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - server-network

  postgresdb:
    profiles: ["postgres"]
    image: postgres:18.6
    container_name: "${CONTAINER_PREFIX:-app}_postgres"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-app_db}"
      POSTGRES_USER: "${DB_USER:-ca_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - server-network

  pgadmin:
    profiles: ["postgres"]
    container_name: "${CONTAINER_PREFIX:-app}_pgadmin"
    image: elestio/pgadmin:latest
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    ports:
      - "${PGADMIN_PORT:-8081}:8080"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${DB_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${DB_PASSWORD}"
      PGADMIN_LISTEN_PORT: 8080
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    depends_on:
      - postgresdb
    networks:
      - server-network
  proxy_https:
    image: nginx:alpine
    container_name: ${PROXY_CONTAINER_NAME:-container_webserver_proxy_https}
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      webserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1/healthz || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - server-network

volumes:
  mariadb_data:
    driver: local
  postgres_data:
    driver: local
